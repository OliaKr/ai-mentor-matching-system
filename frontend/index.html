<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Mentor Matching System</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Inter font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Inter", sans-serif;
      }

      .gradient-bg {
        background: linear-gradient(135deg, #1e3a8a, #0ea5e9);
      }

      .card-shadow {
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
      }

      .mentor-card {
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .mentor-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
      }
    </style>
  </head>

  <body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="gradient-bg text-white py-10 shadow-lg">
      <div class="max-w-5xl mx-auto text-center">
        <h1 class="text-3xl font-bold">Mentor Matching System</h1>
        <p class="text-blue-100 mt-2">
          Find the perfect mentors for your startup based on your needs
        </p>
      </div>
    </header>

    <!-- Main content -->
    <main
      class="max-w-6xl mx-auto mt-10 px-4 md:px-6 grid md:grid-cols-2 gap-8"
    >
      <!-- Left Card -->
      <section class="bg-white rounded-2xl p-8 card-shadow">
        <h2 class="text-xl font-semibold text-gray-800 mb-6">
          Company Interview
        </h2>

        <form
          id="matchingForm"
          class="space-y-6"
        >
          <!-- Hidden webhook URL for production -->
          <input
            type="hidden"
            id="webhookUrl"
            value="https://your-n8n-instance.app.n8n.cloud/webhook/match-company"
          />

          <!-- Company Name -->
          <div>
            <label
              for="companyName"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Company Name</label
            >
            <input
              type="text"
              id="companyName"
              placeholder="Enter your company name"
              class="w-full rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent p-3"
              required
            />
          </div>

          <!-- Sector -->
          <div>
            <label
              for="sector"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Sector (Optional)</label
            >
            <input
              type="text"
              id="sector"
              placeholder="e.g., E-commerce, SaaS, HealthTech, CleanTech"
              class="w-full rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent p-3"
            />
          </div>

          <!-- Description -->
          <div>
            <label
              for="interviewText"
              class="block text-sm font-medium text-gray-700 mb-2"
              >Describe Your Company & Needs</label
            >
            <textarea
              id="interviewText"
              placeholder="Tell us about your company, stage, challenges, and what kind of mentorship you need..."
              class="w-full rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent p-3 h-40 resize-y"
              required
            ></textarea>
          </div>

          <!-- Quick Samples -->
          <div>
            <h4 class="text-sm font-medium text-gray-600 mb-3">
              Quick Samples:
            </h4>
            <div class="flex flex-wrap gap-3">
              <button
                type="button"
                class="px-4 py-2 text-sm bg-gray-100 rounded-lg hover:bg-gray-200 transition"
                onclick="loadSample('ecommerce')"
              >
                E-commerce
              </button>
              <button
                type="button"
                class="px-4 py-2 text-sm bg-gray-100 rounded-lg hover:bg-gray-200 transition"
                onclick="loadSample('saas')"
              >
                B2B SaaS
              </button>
              <button
                type="button"
                class="px-4 py-2 text-sm bg-gray-100 rounded-lg hover:bg-gray-200 transition"
                onclick="loadSample('healthtech')"
              >
                HealthTech
              </button>
              <button
                type="button"
                class="px-4 py-2 text-sm bg-gray-100 rounded-lg hover:bg-gray-200 transition"
                onclick="loadSample('cleantech')"
              >
                CleanTech
              </button>
            </div>
          </div>

          <!-- Submit -->
          <button
            type="submit"
            id="submitBtn"
            class="w-full py-3 mt-4 text-white font-semibold rounded-lg bg-gradient-to-r from-blue-600 to-cyan-500 hover:opacity-90 transition"
          >
            Find Mentors
          </button>
        </form>
      </section>

      <!-- Right Card -->
      <section class="bg-white rounded-2xl p-8 card-shadow">
        <h2 class="text-xl font-semibold text-gray-800 mb-6">
          Top 3 Mentor Matches
        </h2>

        <div
          id="loading"
          class="hidden text-center py-8"
        >
          <div
            class="w-12 h-12 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mx-auto mb-4"
          ></div>
          <p class="text-gray-600">Analyzing and finding best matches...</p>
        </div>

        <div
          id="results"
          class="space-y-5"
        ></div>
      </section>
    </main>

    <footer class="text-center text-gray-500 text-sm mt-12 mb-6">
      © 2025 Mentor Matching System. Powered by n8n & OpenAI API.
    </footer>

    <script>
      // Configuration - use backend API instead of direct webhook
      const CONFIG = {
        // For local development, use:
        apiUrl: "http://localhost:3001/api/match-company",
        // For production, use:
        // apiUrl: "/api/match-company"
      };

      const samples = {
        ecommerce: {
          company: "StyleHub",
          sector: "E-commerce",
          description:
            "We're building StyleHub, a sustainable fashion e-commerce platform. We launched 6 months ago and have 5,000 monthly users, but growth has plateaued. Our main challenge is customer acquisition and marketing ROI. We need help with SEO, content strategy, and UX optimization.",
        },
        saas: {
          company: "DataFlow Analytics",
          sector: "B2B SaaS",
          description:
            "We offer a real-time analytics dashboard for enterprise clients, but face challenges in scalability and ML feature integration. We need guidance on cloud architecture and predictive analytics.",
        },
        healthtech: {
          company: "CareConnect",
          sector: "HealthTech",
          description:
            "We’re building a telemedicine app focused on mental health. Our challenge is product-market fit and user retention. We need mentors with expertise in digital health strategy and UX for patient engagement.",
        },
        cleantech: {
          company: "SolarGrid",
          sector: "CleanTech",
          description:
            "SolarGrid is creating smart energy management for solar homes. We’re raising our pre-seed and need strategic advice for positioning and manufacturing partnerships.",
        },
      };

      function loadSample(type) {
        const s = samples[type];
        document.getElementById("companyName").value = s.company;
        document.getElementById("sector").value = s.sector;
        document.getElementById("interviewText").value = s.description;
      }

      document
        .getElementById("matchingForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const apiUrl = CONFIG.apiUrl;
          const companyName = document.getElementById("companyName").value;
          const sector = document.getElementById("sector").value;
          const interviewText = document.getElementById("interviewText").value;
          const submitBtn = document.getElementById("submitBtn");
          const loading = document.getElementById("loading");
          const results = document.getElementById("results");

          submitBtn.disabled = true;
          loading.classList.remove("hidden");
          results.innerHTML = "";

          try {
            const res = await fetch(apiUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                company_name: companyName,
                sector: sector || "Not specified",
                requirements: interviewText,
              }),
            });

            if (!res.ok) throw new Error("Invalid webhook or request failed.");

            const data = await res.json();
            renderResults(data);
          } catch (err) {
            results.innerHTML = `
              <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded">
                <p class="text-red-700 font-medium">Error:</p>
                <p class="text-red-600 text-sm mt-1">${err.message}</p>
              </div>`;
          } finally {
            loading.classList.add("hidden");
            submitBtn.disabled = false;
          }
        });

      function renderResults(data) {
        const results = document.getElementById("results");
        let html = "";

        if (data.matches && data.matches.length) {
          data.matches.forEach((m) => {
            const skills = Object.values(m.skills || {})
              .filter(Boolean)
              .map(
                (s) =>
                  `<span class="px-3 py-1 bg-blue-50 text-blue-700 text-xs rounded-full">${s}</span>`
              )
              .join(" ");

            html += `
              <div class="mentor-card bg-gray-50 border border-gray-200 rounded-xl p-5">
                <div class="flex items-center justify-between mb-3">
                  <div class="flex items-center gap-3">
                    <div class="w-10 h-10 flex items-center justify-center bg-blue-600 text-white font-bold rounded-full">${m.rank}</div>
                    <div>
                      <h3 class="font-semibold text-gray-800">${m.mentor_name}</h3>
                      <p class="text-gray-500 text-sm">${m.current_role}</p>
                    </div>
                  </div>
                  <span class="text-sm font-medium text-green-600 bg-green-50 px-3 py-1 rounded-full">${m.match_score}% Match</span>
                </div>
                <div class="flex flex-wrap gap-2 mb-3">${skills}</div>
                <p class="text-sm text-gray-600"><strong>Why this match:</strong> ${m.match_explanation}</p>
                <p class="text-xs text-gray-500 mt-3">📧 ${m.mentor_email} • ${m.available_capacity} slots available</p>
              </div>`;
          });
        } else {
          html = `<p class="text-gray-600 text-sm">No mentors matched your criteria. Try adjusting your description.</p>`;
        }

        results.innerHTML = html;
      }
    </script>
  </body>
</html>
