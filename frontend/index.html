<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>AI Mentor Matching System</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      .header {
        text-align: center;
        color: white;
        margin-bottom: 40px;
      }

      .header h1 {
        font-size: 2.5rem;
        margin-bottom: 10px;
      }

      .header p {
        font-size: 1.1rem;
        opacity: 0.9;
      }

      .main-content {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
        margin-bottom: 30px;
      }

      @media (max-width: 968px) {
        .main-content {
          grid-template-columns: 1fr;
        }
      }

      .card {
        background: white;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .card h2 {
        color: #667eea;
        margin-bottom: 20px;
        font-size: 1.5rem;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #333;
      }

      input[type="text"],
      textarea {
        width: 100%;
        padding: 12px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 1rem;
        font-family: inherit;
        transition: border-color 0.3s;
      }

      input[type="text"]:focus,
      textarea:focus {
        outline: none;
        border-color: #667eea;
      }

      textarea {
        min-height: 200px;
        resize: vertical;
      }

      .btn {
        background: #667eea;
        color: white;
        border: none;
        padding: 14px 30px;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.3s;
        width: 100%;
      }

      .btn:hover {
        background: #5568d3;
      }

      .btn:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      .results {
        display: none;
      }

      .results.show {
        display: block;
      }

      .mentor-card {
        background: #f8f9fa;
        border-left: 4px solid #667eea;
        padding: 20px;
        margin-bottom: 15px;
        border-radius: 8px;
      }

      .mentor-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }

      .mentor-rank {
        background: #667eea;
        color: white;
        width: 35px;
        height: 35px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 1.2rem;
      }

      .mentor-info h3 {
        color: #333;
        margin-bottom: 5px;
      }

      .mentor-info p {
        color: #666;
        font-size: 0.9rem;
      }

      .score-badge {
        background: #4caf50;
        color: white;
        padding: 6px 12px;
        border-radius: 20px;
        font-weight: 600;
        font-size: 0.9rem;
      }

      .skills {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 12px 0;
      }

      .skill-tag {
        background: #e3f2fd;
        color: #1976d2;
        padding: 6px 12px;
        border-radius: 16px;
        font-size: 0.85rem;
        font-weight: 500;
      }

      .explanation {
        background: white;
        padding: 15px;
        border-radius: 6px;
        margin-top: 12px;
        font-size: 0.95rem;
        line-height: 1.6;
        color: #555;
      }

      .loading {
        text-align: center;
        padding: 40px;
        color: #666;
      }

      .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #667eea;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
        margin: 20px auto;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .error {
        background: #ffebee;
        border-left: 4px solid #f44336;
        padding: 15px;
        border-radius: 8px;
        color: #c62828;
        margin-top: 15px;
      }

      .company-needs {
        background: #e8eaf6;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
      }

      .company-needs h3 {
        color: #667eea;
        margin-bottom: 10px;
        font-size: 1.1rem;
      }

      .company-needs ul {
        list-style: none;
      }

      .company-needs li {
        padding: 5px 0;
        color: #555;
      }

      .quick-samples {
        margin-top: 15px;
      }

      .quick-samples h4 {
        font-size: 0.9rem;
        color: #666;
        margin-bottom: 10px;
      }

      .sample-btn {
        background: #f0f0f0;
        border: 1px solid #ddd;
        padding: 8px 12px;
        border-radius: 6px;
        font-size: 0.85rem;
        cursor: pointer;
        margin-right: 8px;
        margin-bottom: 8px;
        display: inline-block;
        transition: background 0.3s;
      }

      .sample-btn:hover {
        background: #e0e0e0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🎯 AI Mentor Matching System</h1>
        <p>Find the perfect mentors for your startup based on your needs</p>
      </div>

      <div class="main-content">
        <!-- Input Form -->
        <div class="card">
          <h2>Company Interview</h2>
          <form id="matchingForm">
            <div class="form-group">
              <label for="webhookUrl">n8n Webhook URL</label>
              <input
                type="text"
                id="webhookUrl"
                placeholder="https://your-n8n-instance.app.n8n.cloud/webhook/match-mentors"
                required
              />
            </div>

            <div class="form-group">
              <label for="interviewText">Describe Your Company & Needs</label>
              <textarea
                id="interviewText"
                placeholder="Tell us about your company, stage, challenges, and what kind of mentorship you need..."
                required
              ></textarea>
            </div>

            <div class="quick-samples">
              <h4>Quick Samples:</h4>
              <button
                type="button"
                class="sample-btn"
                onclick="loadSample('ecommerce')"
              >
                E-commerce
              </button>
              <button
                type="button"
                class="sample-btn"
                onclick="loadSample('saas')"
              >
                B2B SaaS
              </button>
              <button
                type="button"
                class="sample-btn"
                onclick="loadSample('healthtech')"
              >
                HealthTech
              </button>
              <button
                type="button"
                class="sample-btn"
                onclick="loadSample('cleantech')"
              >
                CleanTech
              </button>
            </div>

            <button
              type="submit"
              class="btn"
              id="submitBtn"
            >
              Find Mentors
            </button>
          </form>
        </div>

        <!-- Results -->
        <div class="card">
          <h2>Top 5 Mentor Matches</h2>
          <div
            id="results"
            class="results"
          >
            <!-- Results will be displayed here -->
          </div>
          <div
            id="loading"
            class="loading"
            style="display: none"
          >
            <div class="spinner"></div>
            <p>Analyzing and finding best matches...</p>
          </div>
        </div>
      </div>
    </div>

    <script>
      const samples = {
        ecommerce:
          "We're building StyleHub, a sustainable fashion e-commerce platform. We launched 6 months ago and have 5,000 monthly users, but growth has plateaued. Our main challenge is customer acquisition - we're spending too much on ads without great ROI. We need help with digital marketing strategy, specifically SEO and content marketing to build organic traffic. We also need guidance on improving our user experience because our conversion rate is only 1.2%. Our team is technical but lacks marketing expertise.",

        saas: "DataFlow Analytics provides real-time data analytics for enterprise clients. We have 50 customers and $2M ARR, but we're struggling with technical scalability. Our platform crashes when customers process large datasets. We need expertise in cloud architecture and system design to rebuild our infrastructure on AWS. We're also looking to incorporate machine learning features for predictive analytics.",

        healthtech:
          "CareConnect is building a telemedicine platform connecting patients with mental health professionals. We just raised our seed round and are preparing to launch our MVP. Our biggest challenge is finding product-market fit - we're not sure if our current feature set addresses real user needs. We need guidance on product strategy, user research methodologies, and how to iterate quickly based on feedback.",

        cleantech:
          "SolarGrid is developing smart energy management systems for residential solar installations. We're in the pre-seed stage and about to start fundraising. We need help with business strategy - specifically how to position ourselves in the competitive clean energy market. We also need guidance on supply chain management since we'll be manufacturing hardware components.",
      };

      function loadSample(type) {
        document.getElementById("interviewText").value = samples[type];
      }

      document
        .getElementById("matchingForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const webhookUrl = document.getElementById("webhookUrl").value;
          const interviewText = document.getElementById("interviewText").value;
          const submitBtn = document.getElementById("submitBtn");
          const loadingDiv = document.getElementById("loading");
          const resultsDiv = document.getElementById("results");

          // Show loading
          submitBtn.disabled = true;
          loadingDiv.style.display = "block";
          resultsDiv.classList.remove("show");
          resultsDiv.innerHTML = "";

          try {
            const response = await fetch(webhookUrl, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                interview_text: interviewText,
              }),
            });

            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();
            displayResults(data);
          } catch (error) {
            resultsDiv.innerHTML = `
                    <div class="error">
                        <strong>Error:</strong> ${error.message}<br>
                        Please check your webhook URL and try again.
                    </div>
                `;
            resultsDiv.classList.add("show");
          } finally {
            submitBtn.disabled = false;
            loadingDiv.style.display = "none";
          }
        });

      function displayResults(data) {
        const resultsDiv = document.getElementById("results");

        let html = "";

        // Display company needs
        if (data.company_needs) {
          html += `
                    <div class="company-needs">
                        <h3>Your Needs Identified:</h3>
                        <ul>
                            <li><strong>Primary:</strong> ${data.company_needs.primary_skill}</li>
                            <li><strong>Secondary:</strong> ${data.company_needs.secondary_skill}</li>
                            <li><strong>Tertiary:</strong> ${data.company_needs.tertiary_skill}</li>
                            <li><strong>Sector:</strong> ${data.company_needs.sector}</li>
                        </ul>
                    </div>
                `;
        }

        // Display mentors
        if (data.matched_mentors && data.matched_mentors.length > 0) {
          data.matched_mentors.forEach((mentor) => {
            html += `
                        <div class="mentor-card">
                            <div class="mentor-header">
                                <div style="display: flex; align-items: center; gap: 15px;">
                                    <div class="mentor-rank">${
                                      mentor.rank
                                    }</div>
                                    <div class="mentor-info">
                                        <h3>${mentor.name}</h3>
                                        <p>${mentor.current_role}</p>
                                    </div>
                                </div>
                                <div class="score-badge">
                                    ${mentor.match_score}% Match
                                </div>
                            </div>
                            
                            <div class="skills">
                                ${mentor.skills
                                  .map(
                                    (skill) =>
                                      `<span class="skill-tag">${skill}</span>`
                                  )
                                  .join("")}
                                <span class="skill-tag" style="background: #fce4ec; color: #c2185b;">${
                                  mentor.sector
                                }</span>
                            </div>
                            
                            <div class="explanation">
                                <strong>Why this match:</strong> ${
                                  mentor.explanation
                                }
                            </div>
                            
                            <div style="margin-top: 12px; color: #666; font-size: 0.9rem;">
                                📧 ${mentor.email} • 📅 ${
              mentor.available_slots
            } slots available
                            </div>
                        </div>
                    `;
          });
        } else {
          html +=
            "<p>No mentors matched your criteria. Try adjusting your requirements.</p>";
        }

        resultsDiv.innerHTML = html;
        resultsDiv.classList.add("show");
      }

      // Save webhook URL to localStorage
      const webhookInput = document.getElementById("webhookUrl");
      const savedUrl = localStorage.getItem("webhookUrl");
      if (savedUrl) {
        webhookInput.value = savedUrl;
      }

      webhookInput.addEventListener("change", (e) => {
        localStorage.setItem("webhookUrl", e.target.value);
      });
    </script>
  </body>
</html>
